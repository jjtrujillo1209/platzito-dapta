# Producción mínima: Postgres + Platzito. Ollama opcional para embeddings locales.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platzito
      POSTGRES_USER: platzito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-esta-clave}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platzito"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.6.8
    volumes: [ollama:/root/.ollama]
    # Primera vez: docker compose exec ollama ollama pull nomic-embed-text

  app:
    build: .
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://platzito:${POSTGRES_PASSWORD:-cambiar-esta-clave}@db:5432/platzito
      OLLAMA_URL: http://ollama:11434
    ports: ["8700:8700"]
    volumes: [datos:/datos]
    depends_on:
      db: { condition: service_healthy }
      ollama: { condition: service_started }

volumes:
  pgdata:
  ollama:
  datos:
